# XcodeGen spec for Bambu Bar. scripts/build.sh generates BambuBar.xcodeproj from it;
# the project itself is not checked in.
name: BambuBar
options:
  bundleIdPrefix: dev.rolottr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP: "$(DEVELOPMENT_TEAM).dev.rolottr.BambuBar"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_DEBUG_DYLIB: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  BambuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/BambuBar
      - path: Sources/Shared
      - path: Resources/Certificates
        type: folder
        buildPhase: resources
      - path: Resources/hms_en.json
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar
        # Helper codesigning needs temporary sibling files and access to the signing keychain.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Bambu Bar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: BambuBarWidget
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Camera Helper
        shell: /bin/zsh
        inputFiles:
          - $(SRCROOT)/Resources/CameraRelay/bambu-camera.cpp
          - $(SRCROOT)/Resources/CameraRelay/bambu-camera-signature.cpp
          - $(SRCROOT)/Resources/Signing/BambuCamera.entitlements
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bambu-camera
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/libbambu-camera-signature.dylib
        script: |
          set -euo pipefail
          out="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/bambu-camera"
          mkdir -p "${out:h}"
          arch_flags=()
          for arch in ${=ARCHS}; do arch_flags+=(-arch "$arch"); done
          signature="${out:h}/libbambu-camera-signature.dylib"
          /usr/bin/xcrun clang++ -O2 -std=c++17 "${arch_flags[@]}" -isysroot "$SDKROOT" \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" -dynamiclib \
            -framework Security -framework CoreFoundation \
            -install_name @loader_path/libbambu-camera-signature.dylib \
            "$SRCROOT/Resources/CameraRelay/bambu-camera-signature.cpp" -o "$signature"
          /usr/bin/xcrun clang++ -O2 -std=c++17 "${arch_flags[@]}" -isysroot "$SDKROOT" \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SRCROOT/Resources/CameraRelay/bambu-camera.cpp" "$signature" -o "$out"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != NO ]]; then
            /usr/bin/codesign --force --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$signature"
            /usr/bin/codesign --force --options runtime --timestamp=none \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              --entitlements "$SRCROOT/Resources/Signing/BambuCamera.entitlements" "$out"
          fi
  BambuBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BambuBarWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar.Widget
        PRODUCT_NAME: BambuBarWidget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBarWidget.entitlements
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

# Diagnostic uses the installed plugin's native macOS signing metadata.
schemes:
  BambuBar:
    build:
      targets:
        BambuBar: all
    run:
      config: Debug
  Bambu Camera Native Signature Probe:
    build:
      targets:
        BambuBar: all
    run:
      config: Debug
      environmentVariables:
        CAMERA_SIGNATURE_SOURCE: plugin
